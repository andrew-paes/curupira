<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Curupira - Pesquisa em Artigos</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
    textarea { width: 100%; height: 80px; font-size: 1rem; padding: 0.5rem; }
    button { margin-top: 0.5rem; padding: 0.5rem 1rem; font-size: 1rem; cursor: pointer; }
    .result { border: 1px solid #ddd; border-radius: 6px; padding: 1rem; margin: 1rem 0; }
    .result .meta { color: #555; font-size: 0.9rem; }
    .result .confidence { font-weight: bold; }
    .uncertainty { color: #a00; }
    .error { color: #a00; }
  </style>
</head>
<body>
  <h1>Curupira</h1>
  <p>Pesquisa semântica no seu acervo local de artigos científicos.</p>
  <textarea id="question" placeholder="Faça uma pergunta sobre os artigos..."></textarea>
  <button id="ask">Perguntar</button>
  <div id="output"></div>

  <script>
    async function ask() {
      const question = document.getElementById('question').value.trim();
      const output = document.getElementById('output');
      output.innerHTML = '';
      if (!question) return;
      try {
        const resp = await fetch('/ask', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question })
        });
        const data = await resp.json();
        if (!resp.ok) {
          output.innerHTML = `<p class="error">Erro: ${data.message || data.detail || resp.status}</p>`;
          return;
        }
        render(data);
      } catch (e) {
        output.innerHTML = `<p class="error">Falha ao contatar o serviço: ${e.message}</p>`;
      }
    }

    function render(data) {
      const output = document.getElementById('output');
      if (data.uncertainty) {
        output.innerHTML += `<p class="uncertainty">${data.uncertainty}</p>`;
      }
      (data.results || []).forEach(r => {
        const page = (r.page != null) ? `Página: ${r.page}` : 'Página: indeterminada';
        output.innerHTML += `
          <div class="result">
            <div><strong>${r.filename}</strong> <span class="confidence">(${r.confidence})</span></div>
            <div class="meta">${page} — ${r.relevance || ''}</div>
            <p>${r.excerpt || ''}</p>
            <div class="meta">Citação: ${r.citation || '—'}</div>
          </div>`;
      });
      if (data.facts) {
        output.innerHTML += `<h3>Presente nos artigos</h3><p>${data.facts}</p>`;
      }
      if (data.interpretation) {
        output.innerHTML += `<h3>Interpretação da IA</h3><p>${data.interpretation}</p>`;
      }
    }

    document.getElementById('ask').addEventListener('click', ask);
    document.getElementById('question').addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); ask(); }
    });
  </script>
</body>
</html>
